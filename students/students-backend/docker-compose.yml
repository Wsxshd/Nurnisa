services:
  db:
    image: postgres:16-alpine
    container_name: students-db
    environment:
      POSTGRES_DB: studentsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studentsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: students-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/studentsdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8018:8018"

volumes:
  pgdata:
